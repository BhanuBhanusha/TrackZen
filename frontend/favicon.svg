<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a1245"/>
      <stop offset="100%" stop-color="#150727"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d946ef" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="iconPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b94"/>
      <stop offset="100%" stop-color="#f43f8e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#f43f8e" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Rounded Squircle Container -->
  <rect x="3" y="3" width="58" height="58" rx="16" ry="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5"/>

  <!-- 3 Hot Pink Perspective Layers -->
  <g filter="url(#glow)" fill="none" stroke="url(#iconPink)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top Diamond Layer -->
    <path d="M32 15 L14 24 L32 33 L50 24 Z"/>
    <!-- Middle Chevron Layer -->
    <path d="M14 33 L32 42 L50 33"/>
    <!-- Bottom Chevron Layer -->
    <path d="M14 42 L32 51 L50 42"/>
  </g>
</svg>

